<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retrace Destination Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="map-assets/legacy-map-styles.css">
  <link rel="stylesheet" href="map-assets/legacy-map-merge.css">
  <link rel="stylesheet" href="map-assets/map-embed.css">
</head>
<body class="map-embed-body">
  <main id="map-root" class="map-embed-root"></main>
  <p class="map-destination-note" id="map-destination-note" role="status" aria-live="polite">Preparing location evidence…</p>
  <div class="map-info-modal" id="mapInfoModal" role="dialog" aria-modal="true" aria-labelledby="mapInfoTitle">
    <div class="map-info-dialog">
      <button type="button" class="map-info-close" aria-label="Close map information" id="mapInfoClose">×</button>
      <h2 id="mapInfoTitle">Map information</h2>
      <p id="mapInfoDescription"></p>
      <p id="mapInfoAccuracy"></p>
      <a id="mapInfoSourceLink" href="https://trek.nasa.gov/" target="_blank" rel="noopener noreferrer">Open NASA Solar System Treks</a>
    </div>
  </div>
  <script src="map-assets/map-embed-setup.js"></script>
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="map-assets/planetary-map-engine.js"></script>
  <script src="map-assets/map-embed-init.js"></script>
  <script>
    document.getElementById('mapInfoClose').addEventListener('click', function () {
      document.getElementById('mapInfoModal').classList.remove('active');
    });
    document.getElementById('mapInfoModal').addEventListener('click', function (event) {
      if (event.target === this) this.classList.remove('active');
    });
  </script>
</body>
</html>
